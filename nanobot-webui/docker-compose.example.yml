services:
  nanobot-webui:
    build: .
    ports:
      - "6060:6060"
    volumes:
      - ./webui.config.json:/config/webui.config.json:ro
      - nanobot-webui-data:/data
    environment:
      - PORT=6060
      - WEBUI_CONFIG=/config/webui.config.json

  nanobot-alpha:
    image: nanobot-ai:local
    expose:
      - "18790"
      - "8765"

  nanobot-beta:
    image: nanobot-ai:local
    expose:
      - "18790"
      - "8765"

volumes:
  nanobot-webui-data:
