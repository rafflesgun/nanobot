services:
  nanobot-webui:
    build: .
    ports:
      - "6060:6060"
    volumes:
      - ./webui.config.json:/data/config.json:ro
    environment:
      - PORT=6060
      - WEBUI_CONFIG=/data/config.json

  nanobot-alpha:
    image: nanobot-ai:local
    expose:
      - "18790"
      - "8765"

  nanobot-beta:
    image: nanobot-ai:local
    expose:
      - "18790"
      - "8765"
