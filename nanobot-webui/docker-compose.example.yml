services:
  nanobot-webui:
    build: .
    ports:
      - "6060:6060"
    volumes:
      - nanobot-webui-data:/data
    environment:
      - PORT=6060
      - AUTH_TOKEN=change-me
      - NANOBOT_INSTANCES=alpha=http://nanobot-alpha:18790,beta=http://nanobot-beta:18790
      - NANOBOT_INSTANCE_TOKENS=alpha=alpha-token,beta=beta-token
      - NANOBOT_INSTANCE_WEBSOCKET_TOKENS=alpha=alpha-ws-token,beta=beta-ws-token

  nanobot-alpha:
    image: nanobot-ai:local
    expose:
      - "18790"
      - "8765"

  nanobot-beta:
    image: nanobot-ai:local
    expose:
      - "18790"
      - "8765"

volumes:
  nanobot-webui-data:
